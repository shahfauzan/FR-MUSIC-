name: Build FR Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/FR-Music.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FR-Music-APK
          path: release/FR-Music.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FR Music v${{ github.run_number }}
          generate_release_notes: true
          files: release/FR-Music.apk