name: Build FR Music Android App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Keystore & Environment Secrets
        run: |
          echo "Setting up environment configuration..."
          # Create .env from secrets or fallback to .env.example
          if [ -n "${{ secrets.YOUTUBE_API_KEY }}" ]; then
            echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}" > .env
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Ensure debug keystore is ready for signing
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating local debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue
        continue-on-error: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/*.apk release-artifacts/FR-Music.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FR-Music-Debug-APK
          path: release-artifacts/FR-Music.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "FR Music v1.0 (Build ${{ github.run_number }})"
          body: |
            ## 🎵 FR Music - Android Application Release
            
            Welcome to **FR Music** - Your music. Your mood.
            
            ### 📦 Release Details
            - **Build**: `${{ github.run_number }}`
            - **Commit**: `${{ github.sha }}`
            - **Features**: Hindi, English, Punjabi, Bollywood, and Lo-fi music streaming with persistent playback, white & gray theme, and home screen widgets.
            
            ### ⬇️ Download
            Download the attached **`FR-Music.apk`** below to install directly on your Android phone.
          files: |
            release-artifacts/FR-Music.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
